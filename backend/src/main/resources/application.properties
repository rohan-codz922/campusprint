spring.application.name=campusprint
server.port=${PORT:8080}

# Never leak internals in error responses
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# ---- Database ----
# Local default: file-based H2. Production: set DB_URL / DB_USER / DB_PASSWORD (PostgreSQL).
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/campusprint}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Uploads (document <= 10 MB, payment proof <= 3 MB, both in one request) ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=14MB
app.limits.max-pages=500

# ---- Business rule: jobs with this many pages (pages x copies) or more must be paid first ----
app.payment.required-pages=${PAYMENT_REQUIRED_PAGES:20}

# ---- Secrets: NO defaults on purpose. The app refuses to start if these are missing. ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-hours=12
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# Comma-separated web origins allowed to call this API from a browser.
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}

# ---- Email (Brevo) for verification and password-reset codes ----
app.mail.api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:CampusPrint}
# Local testing only: prints codes to the console when email is not configured.
app.mail.log-codes=${MAIL_LOG_CODES:false}
