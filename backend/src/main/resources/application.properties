spring.application.name=campusprint
server.port=${PORT:8080}

# ---- Database ----
# Default: file-based H2 (zero setup, great for local development).
# Production: set DB_URL / DB_USER / DB_PASSWORD to a PostgreSQL database (see README).
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/campusprint}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
# Hibernate creates/updates the tables from the @Entity classes automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- File uploads (stored in the database) ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB


# ---- Security ----
# Comma-separated list of web origins allowed to call this API from a browser.
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
# Must be at least 32 characters. ALWAYS override in production.
app.jwt.secret=${JWT_SECRET:development-only-secret-change-me-before-deploying-123}
app.jwt.expiry-hours=24

# First admin account, created on first start if no admin exists.
app.admin.email=${ADMIN_EMAIL:admin@campus.edu}
app.admin.password=${ADMIN_PASSWORD:admin123}

# ---- Email (Brevo) for password-reset codes ----
app.mail.api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:CampusPrint}
